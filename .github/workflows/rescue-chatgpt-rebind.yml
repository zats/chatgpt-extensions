name: Rescue ChatGPT rebind state

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: write
  issues: write

concurrency:
  group: chatgpt-rebind-rescuer
  cancel-in-progress: false

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Reconcile exact issue, run, and frozen batch state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/trigger-chatgpt-rebind.mjs rescue \
            --repository "$GITHUB_REPOSITORY" \
            --worker-actor "$GITHUB_REPOSITORY_OWNER"
