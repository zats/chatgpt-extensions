name: Refresh authentication after a completed rebind

on:
  workflow_run:
    workflows:
      - Rebind ChatGPT
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  locate:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      agent-artifact: ${{ steps.artifacts.outputs.agent-artifact }}
      agent-source-attempt: ${{ steps.artifacts.outputs.agent-source-attempt }}
      test-artifact: ${{ steps.artifacts.outputs.test-artifact }}
      test-source-attempt: ${{ steps.artifacts.outputs.test-source-attempt }}
    steps:
      - name: Locate the newest exact encrypted handoffs at or before this attempt
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
            | jq '{artifacts: [ .[] | .artifacts[] ]}' > "$RUNNER_TEMP/artifacts.json"
          agent_record="$(jq -c \
            --arg run "$SOURCE_RUN_ID" \
            --argjson maximum "$SOURCE_ATTEMPT" '
              [.artifacts[] |
                select(.expired == false) |
                . as $artifact |
                (try (.name | capture("^ci-auth-refresh-agent-" + $run + "-(?<attempt>[0-9]+)$")) catch empty) as $match |
                select(($match.attempt | tonumber) <= $maximum) |
                {name: $artifact.name, attempt: ($match.attempt | tonumber), createdAt: $artifact.created_at}
              ] | sort_by(.attempt, .createdAt) | last // {}
            ' "$RUNNER_TEMP/artifacts.json")"
          test_record="$(jq -c \
            --arg run "$SOURCE_RUN_ID" \
            --argjson maximum "$SOURCE_ATTEMPT" '
              [.artifacts[] |
                select(.expired == false) |
                . as $artifact |
                (try (.name | capture("^ci-auth-refresh-test-" + $run + "-(?<attempt>[0-9]+)-[A-Za-z0-9][A-Za-z0-9._-]*$")) catch empty) as $match |
                select(($match.attempt | tonumber) <= $maximum) |
                {name: $artifact.name, attempt: ($match.attempt | tonumber), createdAt: $artifact.created_at}
              ] | sort_by(.attempt, .createdAt) | last // {}
            ' "$RUNNER_TEMP/artifacts.json")"
          {
            echo "agent-artifact=$(jq -r '.name // empty' <<< "$agent_record")"
            echo "agent-source-attempt=$(jq -r '.attempt // empty' <<< "$agent_record")"
            echo "test-artifact=$(jq -r '.name // empty' <<< "$test_record")"
            echo "test-source-attempt=$(jq -r '.attempt // empty' <<< "$test_record")"
          } >> "$GITHUB_OUTPUT"

  refresh-agent:
    needs: locate
    if: needs.locate.outputs.agent-artifact != ''
    uses: ./.github/workflows/refresh-auth-handoff.yml
    with:
      artifact_name: ${{ needs.locate.outputs.agent-artifact }}
      artifact_run_id: ${{ github.event.workflow_run.id }}
      role: agent
      source_run_id: ${{ github.event.workflow_run.id }}
      source_run_attempt: ${{ needs.locate.outputs.agent-source-attempt }}
      target_environment: codex-agent
      target_secret: CODEX_AGENT_AUTH_JSON
    secrets: inherit

  refresh-test:
    needs: locate
    if: needs.locate.outputs.test-artifact != ''
    uses: ./.github/workflows/refresh-auth-handoff.yml
    with:
      artifact_name: ${{ needs.locate.outputs.test-artifact }}
      artifact_run_id: ${{ github.event.workflow_run.id }}
      role: test
      source_run_id: ${{ github.event.workflow_run.id }}
      source_run_attempt: ${{ needs.locate.outputs.test-source-attempt }}
      target_environment: chatgpt-test
      target_secret: CHATGPT_TEST_AUTH_JSON
    secrets: inherit
