name: Backtest ChatGPT bindings

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: chatgpt-binding-backtest-batch
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      snapshot-artifact-name: ${{ steps.identity.outputs.name }}
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Resolve one exact appcast snapshot
        run: |
          node scripts/resolve-appcast-versions.mjs \
            --offsets "0,2,4" \
            --output "$RUNNER_TEMP/appcast-snapshot.json"
      - name: Save exact snapshot
        id: identity
        run: echo "name=chatgpt-appcast-snapshot-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Upload exact snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.identity.outputs.name }}
          path: ${{ runner.temp }}/appcast-snapshot.json
          if-no-files-found: error
          retention-days: 30

  dispatch:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      issues: write
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Download the frozen appcast snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.resolve.outputs.snapshot-artifact-name }}
          path: ${{ runner.temp }}/snapshot
      - name: Create the frozen queue and dispatch its first backtest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/trigger-chatgpt-rebind.mjs batch \
            --snapshot "$RUNNER_TEMP/snapshot/appcast-snapshot.json" \
            --repository "$GITHUB_REPOSITORY"
